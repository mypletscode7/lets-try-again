<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Andy's Bar | Menu</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/menu.css">


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">


</head>


<body>



<!-- NAVBAR -->


<header class="navbar">


<div class="logo">
ANDY'S BAR
</div>


<nav>

<a href="index.html">
Home
</a>

<a href="menu.html">
Menu
</a>

<a href="index.html#specials">
Specials
</a>

<a href="index.html#contact">
Contact
</a>


</nav>



<button class="cart-button">

🛒 Cart

<span id="cart-count">
0
</span>

</button>


</header>







<!-- MENU HERO -->


<section class="menu-hero">


<div>


<p>
ANDY'S BAR
</p>


<h1>
Our Menu
</h1>


<h2>
German Classics • Namibian Favourites • Premium Drinks
</h2>


</div>


</section>









<!-- SEARCH -->


<section class="menu-controls">


<input 
type="text"
id="search"
placeholder="Search food or drinks..."
>



<div class="categories">


<button class="category active"
data-category="all">

All

</button>


<button class="category"
data-category="burger">

Burgers

</button>


<button class="category"
data-category="steak">

Steaks

</button>



<button class="category"
data-category="pizza">

Pizza

</button>



<button class="category"
data-category="german">

German

</button>



<button class="category"
data-category="drinks">

Drinks

</button>



</div>



</section>









<!-- MENU ITEMS -->


<section class="menu-container">


<div id="menu-grid">




<!-- ITEMS LOADED BY JAVASCRIPT -->



</div>



</section>









<!-- SHOPPING CART -->


<div class="cart-panel">


<div class="cart-header">

<h2>
Your Order
</h2>


<button id="close-cart">

✕

</button>


</div>





<div id="cart-items">


<p>
Your cart is empty
</p>


</div>





<div class="cart-total">


Total:

<strong id="cart-total">
N$0
</strong>


</div>





<button class="checkout">

Proceed To Checkout

</button>



</div>









<!-- CHECKOUT POPUP -->


<div class="checkout-modal">



<div class="checkout-box">


<button class="close-checkout">
✕
</button>



<h2>
Pickup Order
</h2>


<input 
placeholder="Your Name"
>



<input 
placeholder="Phone Number"
>



<textarea
placeholder="Special instructions">
</textarea>




<button>

Confirm Order

</button>


</div>



</div>








<footer>


<h2>
ANDY'S BAR
</h2>


<p>
Good Food. Cold Drinks. Great Memories.
</p>


</footer>






<script src="js/menu.js"></script>


</body>

</html>
